<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 260" role="img" aria-labelledby="title desc">
  <title id="title">Horario ITS</title>
  <desc id="desc">Logotipo guinda con calendario y un burro pardo estilizado.</desc>
  <defs>
    <linearGradient id="wine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f0018"/>
      <stop offset="1" stop-color="#a61b36"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#18040a" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
